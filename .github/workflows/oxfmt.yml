name: Oxfmt

on:
  pull_request:
    paths-ignore:
      - "**/*.mdx"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
      - next
    paths-ignore:
      - "**/*.mdx"
      - "pnpm-lock.yaml"
permissions:
  contents: read
env:
  FORCE_COLOR: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11
          cache: true
          runtime: node@lts

      - name: Run Oxfmt
        uses: oxc-project/oxfmt-action@5f25fc2dccfa7335bc29ceceecc610d8b5c93d64 # v0.0.1
        with:
          config: oxfmt.config.ts
