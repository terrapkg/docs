name: Lunaria

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - "src/content/docs/*/**/*.mdx"
permissions:
  contents: read

jobs:
  overview:
    name: Overview
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Necessary for Lunaria to work properly
          fetch-depth: 0

      - name: Set Up PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.9
        with:
          version: latest

      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm ci

      - name: Generate Lunaria Overview
        # TODO: Swap to lunariajs/action once it has releases. Note that this action is still from the dev of Lunaria so it's still official.
        uses: yanthomasdev/lunaria-action@06ad5ab2704d030708baf3b279ca0446b418e853 # v0.1.0
