name: Astro

on:
  pull_request:
  push:
    branches:
      - main
      - next
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: true
  ASTRO_DISABLE_UPDATE_CHECK: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Astro runs using Bun's Node.js runtime and needs an appropriate Node.js version
      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache Build
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/node_modules/.astro
          key: astro-build-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/astro.config.mjs', '**/*.jpg', '**/*.mdx', '**/*.png', '**/*.svg', '**/*.webp') }}
          restore-keys: |
            astro-build-${{ hashFiles('**/bun.lock') }}-

      - name: Install Dependencies
        run: bun ci

      - name: Build With Astro
        run: bun run build
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Astro runs using Bun's Node.js runtime and needs an appropriate Node.js version
      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache Build
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/node_modules/.astro
          key: astro-check-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/astro.config.mjs', '**/*.jpg', '**/*.mdx', '**/*.png', '**/*.svg', '**/*.webp') }}
          restore-keys: |
            astro-check-${{ hashFiles('**/bun.lock') }}-

      - name: Install Dependencies
        run: bun ci

      - name: Run Checks With Astro
        run: bun run check
  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    env:
      CHECK_LINKS: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Astro runs using Bun's Node.js runtime and needs an appropriate Node.js version
      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # We don't want to save caches from these runs because they can invalidate it. See: https://starlight-links-validator.vercel.app/getting-started/#installation
      - name: Restore Cache
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/node_modules/.astro
          key: astro-build-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/astro.config.mjs', '**/*.jpg', '**/*.mdx', '**/*.png', '**/*.svg', '**/*.webp') }}
          restore-keys: |
            astro-build-${{ hashFiles('**/bun.lock') }}-

      - name: Install Dependencies
        run: bun ci

      - name: Run Build And Check
        run: bun run build
