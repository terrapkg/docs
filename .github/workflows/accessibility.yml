name: Accessibility

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - "astro.config.*"
      - "playwright.config.*"
      - "tailwind.config.*"
      - "bun.lock"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.mdx"
      - "tests/**"
  push:
    branches:
      - main
      - next
    paths:
      - "astro.config.*"
      - "playwright.config.*"
      - "tailwind.config.*"
      - "bun.lock"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.mdx"
      - "tests/**"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache Build
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/node_modules/.astro
          key: astro-dev-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/astro.config.mjs', '**/*.jpg', '**/*.mdx', '**/*.png', '**/*.svg', '**/*.webp') }}
          restore-keys: |
            astro-dev-${{ hashFiles('**/bun.lock') }}-

      - name: Install Dependencies
        run: bun ci

      - name: Run Accessibility Audit
        env:
          FORCE_COLOR: 1
        shell: bash
        run: bun run test:ci
