name: Accessibility

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - "astro.config.*"
      - "playwright.config.*"
      - "tailwind.config.*"
      - "pnpm-lock.yaml"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.mdx"
      - "tests/**"
  push:
    branches:
      - main
      - next
    paths:
      - "astro.config.*"
      - "playwright.config.*"
      - "tailwind.config.*"
      - "pnpm-lock.yaml"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.mdx"
      - "tests/**"
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up PNPM
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11
          cache: true
          runtime: node@lts

      - name: Run Accessibility Audit
        shell: bash
        run: pnpm run test:ci
