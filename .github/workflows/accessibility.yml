name: Accessibility

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - "astro.config.*"
      - "playwright.config.*"
      - "tailwind.config.*"
      - "pnpm-lock.yaml"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.mdx"
      - "tests/**"
  push:
    branches:
      - main
      - next
    paths:
      - "astro.config.*"
      - "playwright.config.*"
      - "tailwind.config.*"
      - "pnpm-lock.yaml"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.mdx"
      - "tests/**"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Cache Build
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.local/share/pnpm
            ${{ github.workspace }}/node_modules/.astro
          key: astro-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/astro.config.mjs', '**/*.jpg', '**/*.mdx', '**/*.png', '**/*.svg', '**/*.webp') }}
          restore-keys: |
            astro-build-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install Dependencies
        run: pnpm ci

      - name: Run Accessibility Audit
        env:
          FORCE_COLOR: 1
        shell: bash
        run: pnpm run --allow-all npm:playwright test
