name: Accessibility

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - "astro.config.*"
      - "playwright.config.*"
      - "tailwind.config.*"
      - "bun.lock"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.mdx"
      - "tests/**"
  push:
    branches:
      - main
      - next
    paths:
      - "astro.config.*"
      - "playwright.config.*"
      - "tailwind.config.*"
      - "bun.lock"
      - "**/*.astro"
      - "**/*.css"
      - "**/*.mdx"
      - "tests/**"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set Up Deno
        uses: denoland/setup-deno@ff4860f9d7236f320afa0f82b7e6457384805d05 # v2.0.4
        with:
          cache: true

      - name: Cache Build
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/deno
            ${{ github.workspace }}/node_modules/.astro
          key: astro-build-${{ hashFiles('**/deno.lock') }}-${{ hashFiles('**/astro.config.mjs', '**/*.jpg', '**/*.mdx', '**/*.png', '**/*.svg', '**/*.webp') }}
          restore-keys: |
            astro-build-${{ hashFiles('**/deno.lock') }}-

      - name: Install Dependencies
        run: deno ci

      - name: Run Accessibility Audit
        env:
          FORCE_COLOR: 1
        shell: bash
        run: deno run test:ci
