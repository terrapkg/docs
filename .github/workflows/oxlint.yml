name: Oxlint

on:
  pull_request:
    paths:
      - "**/*.mjs"
      - "**/*.tsx"
      - "**/*.ts"
  push:
    branches:
      - main
      - next
    paths:
      - "**/*.mjs"
      - "**/*.tsx"
      - "**/*.ts"
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Cache Build
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.local/share/pnpm
            ${{ github.workspace }}/node_modules/.astro
          key: astro-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/astro.config.mjs', '**/*.jpg', '**/*.mdx', '**/*.png', '**/*.svg', '**/*.webp') }}
          restore-keys: |
            astro-build-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install Dependencies
        run: pnpm ci

      - name: Run Oxlint
        uses: oxc-project/oxlint-action@b78c21302e4bc637e83927135c35a6684de1053e # v3.1.0
        with:
          config: oxlint.config.ts
          plugins: node react react-perf
