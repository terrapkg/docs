name: Oxlint

on:
  pull_request:
    paths:
      - "**/*.mjs"
      - "**/*.tsx"
      - "**/*.ts"
  push:
    branches:
      - main
      - next
    paths:
      - "**/*.mjs"
      - "**/*.tsx"
      - "**/*.ts"
permissions:
  contents: read
env:
  FORCE_COLOR: 1

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up PNPM
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11
          cache: true
          runtime: node@lts

      - name: Run Oxlint
        uses: oxc-project/oxlint-action@b78c21302e4bc637e83927135c35a6684de1053e # v3.1.0
        with:
          config: oxlint.config.ts
          plugins: node react react-perf
