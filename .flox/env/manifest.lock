    "schema-version": "1.10.0",
    "install": {
      "nodejs": {
        "pkg-path": "nodejs"
      },
      "pnpm": {
        "pkg-path": "pnpm"
      }
    },
    "hook": {
      "on-activate": "\n  pnpm ci\n  echo \"\"\n  echo \"run 'flox services start dev' to start the dev server at localhost:4321\"\n  echo \"\"\n  echo \"run 'flox services start dev-host' to start the dev server and expose to the LAN/Tailnet at hostname:4321\"\n  echo \"\"\n  echo \"Contact Jaiden for help with Flox @ Fyra\"\n  echo \"\"\n  echo \"\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ]
    },
    "services": {
      "dev": {
        "command": "pnpm dev"
      },
      "dev-host": {
        "command": "pnpm dev --host"
      }
    }
  },
